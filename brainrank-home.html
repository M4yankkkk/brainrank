<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brainrank — Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EBF1; --tray:#DFE2EA; --card:#FFFFFF; --ink:#1B1E31; --ink-2:#5B6078; --line:#D3D7E2;
  --violet:#7E62F0; --violet-deep:#5B41C9; --violet-soft:#EEE9FF;
  --orange:#FF7F36; --orange-deep:#D95E17; --orange-soft:#FFEEE3;
  --teal:#14A89B; --teal-deep:#0C8076; --teal-soft:#DDF5F2;
  --sun:#FFC23D; --good:#2FB36B;
  --edge:rgba(27,30,49,.10);
  --display:"Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif;
  --ui:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141728; --tray:#1B1F34; --card:#232842; --ink:#F1F2F8; --ink-2:#A3A8C3; --line:#30365A;
    --violet-soft:#2E2758; --orange-soft:#3B2A24; --teal-soft:#173A3A; --edge:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141728; --tray:#1B1F34; --card:#232842; --ink:#F1F2F8; --ink-2:#A3A8C3; --line:#30365A;
  --violet-soft:#2E2758; --orange-soft:#3B2A24; --teal-soft:#173A3A; --edge:rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
.app{max-width:440px;margin:0 auto;min-height:100vh;padding:18px 18px 110px;position:relative}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand-mark{width:26px;height:26px;border-radius:8px;background:var(--ink);display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:5px}
.brand-mark i{border-radius:2px;background:var(--bg)}
.brand-mark i:nth-child(1){background:var(--violet)}
.brand-mark i:nth-child(4){background:var(--orange)}
.top-right{display:flex;align-items:center;gap:10px}
.streak{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:7px 12px 7px 10px;font-weight:700;font-size:14px;box-shadow:0 2px 0 var(--edge)}
.me{width:36px;height:36px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;border:3px solid var(--card)}

/* Today summary */
.today{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.today h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.03em;margin:0 0 8px}
.today p{margin:0;color:var(--ink-2);font-size:14px;font-weight:500}
.score{text-align:right}
.score b{font-family:var(--display);font-size:40px;font-weight:800;line-height:1;letter-spacing:-.03em;display:block}
.score span{font-size:13px;color:var(--ink-2);font-weight:600}
.progress{display:flex;gap:6px;margin-bottom:20px}
.progress i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.progress i.on{background:var(--violet)}

/* Puzzle cards */
.cards{display:flex;flex-direction:column;gap:14px;margin-bottom:30px}
.card{--c:var(--violet);--cd:var(--violet-deep);--cs:var(--violet-soft);
  display:flex;align-items:center;gap:16px;background:var(--card);border-radius:22px;padding:14px;
  box-shadow:0 5px 0 var(--edge);border:none;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;
  transition:transform .12s cubic-bezier(.3,1.6,.5,1), box-shadow .12s}
.card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.card:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.card.orange{--c:var(--orange);--cd:var(--orange-deep);--cs:var(--orange-soft)}
.card.teal{--c:var(--teal);--cd:var(--teal-deep);--cs:var(--teal-soft)}
.board{width:92px;height:92px;flex:none;border-radius:16px;background:var(--cs);padding:8px;position:relative}
.info{flex:1;min-width:0}
.info h2{font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);font-weight:600}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c)}
.play{flex:none;background:var(--c);color:#fff;font-weight:700;font-size:15px;border-radius:14px;padding:11px 16px;box-shadow:0 3px 0 var(--cd)}
.done{flex:none;text-align:center;min-width:64px}
.done b{font-family:var(--display);font-size:28px;font-weight:800;color:var(--c);line-height:1;display:block}
.done span{font-size:12px;color:var(--ink-2);font-weight:600}

/* Mini boards */
.sf{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;height:100%}
.sf i{border-radius:3px;display:grid;place-items:center;font-size:10px;color:#fff;font-style:normal}
.sf .r0{background:#B9A8FF}.sf .r1{background:#9D86F7}.sf .r2{background:#CFC3FF}.sf .r3{background:#8A70F0}.sf .r4{background:#DCD3FF}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;height:100%}
.sw i{background:var(--card);border-radius:4px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12px;font-style:normal;color:var(--ink);box-shadow:0 1.5px 0 var(--edge)}
.sw i.ok{background:var(--good);color:#fff}
.ub{position:relative;height:100%;border-radius:6px;background:repeating-linear-gradient(0deg,transparent 0 calc(100%/6 - 1px),rgba(20,168,155,.15) calc(100%/6 - 1px) calc(100%/6)),var(--cs)}
.ub i{position:absolute;border-radius:4px;background:#8FD9D1;box-shadow:0 1.5px 0 rgba(12,128,118,.35)}
.ub i.key{background:var(--orange)}
.ub .exit{position:absolute;right:-8px;top:calc(100%/6*2 + 2px);width:4px;height:calc(100%/6 - 4px);background:var(--orange);border-radius:2px}

/* Group */
.group-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.group-head h3{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
.group-head a{font-size:14px;font-weight:700;color:var(--violet);text-decoration:none}
.season{background:var(--tray);border-radius:22px;padding:14px}
.season-bar{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink-2);margin:2px 4px 12px}
.days{display:flex;gap:3px}
.days i{width:9px;height:9px;border-radius:3px;background:var(--line)}
.days i.on{background:var(--ink)}
.days i.now{background:var(--violet)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 12px}
.row.you{outline:2px solid var(--violet)}
.rank{width:18px;font-family:var(--display);font-weight:800;font-size:16px;color:var(--ink-2);text-align:center}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;position:relative;flex:none}
.av .crown{position:absolute;top:-9px;right:-5px;font-size:14px}
.who{flex:1;min-width:0}
.who b{font-size:15px;font-weight:700;display:block}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:14px;height:5px;border-radius:9px;background:var(--line)}
.pips i.v{background:var(--violet)}.pips i.o{background:var(--orange)}.pips i.t{background:var(--teal)}
.pts{text-align:right}
.pts b{font-family:var(--display);font-weight:800;font-size:18px;display:block;letter-spacing:-.01em}
.pts span{font-size:12px;font-weight:600;color:var(--ink-2)}
.pts span.up{color:var(--good)}

/* Tab bar */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(440px,100%);padding:10px 18px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.tabs nav{display:flex;justify-content:space-around;background:var(--ink);border-radius:22px;padding:10px 6px}
.tabs a{color:rgba(255,255,255,.55);text-decoration:none;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 12px}
:root[data-theme="dark"] .tabs a, .tabs a{}
.tabs a.on{color:#fff}
.tabs svg{width:22px;height:22px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs nav{background:#2C3254}}
:root[data-theme="dark"] .tabs nav{background:#2C3254}

/* Entrance: one orchestrated drop-in of the cards */
@media (prefers-reduced-motion: no-preference){
  .card{animation:drop .5s cubic-bezier(.3,1.5,.5,1) both}
  .card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
  @keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.97)}}
}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand"><span class="brand-mark"><i></i><i></i><i></i><i></i></span>Brainrank</div>
    <div class="top-right">
      <div class="streak" title="Daily streak">🔥 12</div>
      <div class="me" aria-label="Your profile">YO</div>
    </div>
  </header>

  <section class="today">
    <div>
      <h1>Today’s set</h1>
      <p id="reset">New puzzles in 14h 22m</p>
    </div>
    <div class="score"><b>94</b><span>of 300 points</span></div>
  </section>
  <div class="progress" aria-label="1 of 3 puzzles done"><i class="on"></i><i></i><i></i></div>

  <section class="cards">
    <!-- Starfield: done -->
    <button class="card" data-name="Starfield" data-done="1">
      <div class="board">
        <div class="sf" id="sf"></div>
      </div>
      <div class="info">
        <h2>Starfield</h2>
        <div class="meta"><span class="dots"><i class="on"></i><i class="on"></i><i></i></span>Solved in 1:12</div>
      </div>
      <div class="done"><b>94</b><span>points</span></div>
    </button>

    <!-- Shiftword -->
    <button class="card orange" data-name="Shiftword">
      <div class="board">
        <div class="sw">
          <i>O</i><i>M</i><i>R</i><i>A</i>
          <i class="ok">T</i><i class="ok">I</i><i class="ok">D</i><i class="ok">E</i>
          <i>E</i><i>S</i><i>N</i><i>A</i>
          <i>K</i><i>L</i><i>A</i><i>E</i>
        </div>
      </div>
      <div class="info">
        <h2>Shiftword</h2>
        <div class="meta"><span class="dots"><i class="on"></i><i class="on"></i><i></i></span>About 2 min</div>
      </div>
      <div class="play">Play</div>
    </button>

    <!-- Unblock -->
    <button class="card teal" data-name="Unblock">
      <div class="board">
        <div class="ub">
          <i class="key" style="left:2%;top:calc(100%/6*2 + 2%);width:31%;height:14%"></i>
          <i style="left:35%;top:2%;width:14%;height:48%"></i>
          <i style="left:52%;top:18%;width:14%;height:31%"></i>
          <i style="left:68%;top:35%;width:14%;height:48%"></i>
          <i style="left:2%;top:52%;width:48%;height:14%"></i>
          <i style="left:52%;top:85%;width:46%;height:13%"></i>
          <i style="left:68%;top:2%;width:30%;height:14%"></i>
          <span class="exit"></span>
        </div>
      </div>
      <div class="info">
        <h2>Unblock</h2>
        <div class="meta"><span class="dots"><i class="on"></i><i></i><i></i></span>About 1 min</div>
      </div>
      <div class="play">Play</div>
    </button>
  </section>

  <section>
    <div class="group-head">
      <h3>Hostel Crew</h3>
      <a href="#">See group</a>
    </div>
    <div class="season">
      <div class="season-bar">
        <span>Season 3, day 9 of 14</span>
        <span class="days" aria-hidden="true">
          <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="now"></i><i></i><i></i><i></i><i></i><i></i>
        </span>
      </div>
      <div class="rows">
        <div class="row">
          <span class="rank">1</span>
          <span class="av" style="background:#7E62F0">KA<span class="crown">👑</span></span>
          <div class="who"><b>Karan</b><div class="pips"><i class="v"></i><i class="o"></i><i class="t"></i></div></div>
          <div class="pts"><b>1,842</b><span class="up">+271 today</span></div>
        </div>
        <div class="row you">
          <span class="rank">2</span>
          <span class="av" style="background:#FF7F36">YO</span>
          <div class="who"><b>You</b><div class="pips"><i class="v"></i><i></i><i></i></div></div>
          <div class="pts"><b>1,796</b><span class="up">+94 today</span></div>
        </div>
        <div class="row">
          <span class="rank">3</span>
          <span class="av" style="background:#14A89B">RI</span>
          <div class="who"><b>Riya</b><div class="pips"><i class="v"></i><i class="o"></i><i></i></div></div>
          <div class="pts"><b>1,701</b><span class="up">+183 today</span></div>
        </div>
        <div class="row">
          <span class="rank">4</span>
          <span class="av" style="background:#E0527A">AM</span>
          <div class="who"><b>Aman</b><div class="pips"><i></i><i></i><i></i></div></div>
          <div class="pts"><b>1,560</b><span>Not played</span></div>
        </div>
      </div>
    </div>
  </section>

</div>

<div class="tabs">
  <nav>
    <a href="#" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Today</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.3 0 4 1.4 4.5 4"/></svg>Groups</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11"/><path d="M10 20V5"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Stats</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.3-6 8-6s7 2 8 6"/></svg>Profile</a>
  </nav>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
// Starfield thumbnail
(function(){
  const regions=[0,0,1,1,1, 0,2,2,1,3, 4,2,2,3,3, 4,4,2,2,3, 4,4,4,3,3];
  const stars=new Set([0,7,14,16,23]);
  const el=document.getElementById('sf');
  regions.forEach((r,i)=>{const c=document.createElement('i');c.className='r'+r;if(stars.has(i))c.textContent='★';el.appendChild(c);});
})();

// Live countdown to local midnight
function tick(){
  const now=new Date(), mid=new Date(now); mid.setHours(24,0,0,0);
  const m=Math.floor((mid-now)/60000), h=Math.floor(m/60);
  document.getElementById('reset').textContent=`New puzzles in ${h}h ${m%60}m`;
}
tick(); setInterval(tick,30000);

// Card taps: small feedback so the mockup responds
const toast=document.getElementById('toast'); let t;
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{
  const name=c.dataset.name;
  toast.textContent=c.dataset.done?`${name} solved. You beat 82% of players.`:`Opening ${name}…`;
  toast.classList.add('show'); clearTimeout(t); t=setTimeout(()=>toast.classList.remove('show'),1800);
  if(navigator.vibrate) try{navigator.vibrate(10)}catch(e){}
}));
</script>
</body>
</html>
